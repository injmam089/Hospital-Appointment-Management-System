spring:
  application:
    name: hams-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hamsdb}
    username: ${DB_USERNAME:hams_user}
    password: ${DB_PASSWORD:hams_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      pool-name: HamsHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

hams:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongAndSecureSecretKeyForHAMSJWTTokenGeneration2024MustBeAtLeast256BitsLong}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15
  admin:
    default-email: ${ADMIN_EMAIL:admin@hams.local}
    default-password: ${ADMIN_PASSWORD:Admin@HAMS2024!}
  seed:
    demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    com.hams: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
